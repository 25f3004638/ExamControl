{% extends "base.html" %}
{% block title %}Login - EMP{% endblock %}
{% block nav_links %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Examination Management Portal</h5>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small mb-3">Sign in to your account.</p>

                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="role" id="role-input" value="{{ request.form.role or 'student' }}">

                    <ul class="nav nav-tabs mb-3" id="roleTabs">
                        <li class="nav-item">
                            <button class="nav-link {% if (request.form.role or 'student')=='student' %}active{% endif %}"
                                    type="button" data-bs-toggle="tab" data-bs-target="#tab-student"
                                    onclick="setRole('student')">Student</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link {% if (request.form.role or 'student')=='examiner' %}active{% endif %}"
                                    type="button" data-bs-toggle="tab" data-bs-target="#tab-examiner"
                                    onclick="setRole('examiner')">Examiner</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link {% if (request.form.role or 'student')=='admin' %}active{% endif %}"
                                    type="button" data-bs-toggle="tab" data-bs-target="#tab-admin"
                                    onclick="setRole('admin')">Admin</button>
                        </li>
                    </ul>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email / Username</label>
                        <input type="text" name="username" class="form-control" required
                               placeholder="you@example.com" value="{{ request.form.username or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <div class="mt-3 text-center small">
                    <span class="text-muted">New here?</span>
                    <a href="{{ url_for('register_student') }}">Register as Student</a> &middot;
                    <a href="{{ url_for('register_examiner') }}">Register as Examiner</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function setRole(role) {
    document.getElementById('role-input').value = role;
}
</script>
{% endblock %}
