{% extends "base.html" %}
{% block title %}Student Registration - EMP{% endblock %}
{% block nav_links %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Student Registration</h5>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small mb-3">Create your student account.</p>

                <form method="POST" action="{{ url_for('register_student') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">First Name</label>
                            <input type="text" name="first_name" class="form-control" required
                                   value="{{ request.form.first_name or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Last Name</label>
                            <input type="text" name="last_name" class="form-control" required
                                   value="{{ request.form.last_name or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" required
                                   value="{{ request.form.email or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Phone</label>
                            <input type="text" name="phone" class="form-control"
                                   value="{{ request.form.phone or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Student ID / Roll No.</label>
                            <input type="text" name="student_id" class="form-control" required
                                   value="{{ request.form.student_id or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Course</label>
                            <select name="course_id" class="form-select" required>
                                <option value="">Select Course</option>
                                {% for c in courses %}
                                    <option value="{{ c.id }}" {% if request.form.course_id == c.id|string %}selected{% endif %}>
                                        {{ c.code }} - {{ c.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Year / Semester</label>
                            <input type="text" name="year" class="form-control"
                                   placeholder="e.g., 2024 / Sem 3"
                                   value="{{ request.form.year or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-3">Register</button>
                </form>

                <div class="mt-3 text-center small">
                    <a href="{{ url_for('login') }}">Already have an account? Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
